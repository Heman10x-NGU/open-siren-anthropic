<?xml version="1.0" encoding="UTF-8"?>
<svg id="siren-bench-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="siren-bench-title siren-bench-desc">
  <title id="siren-bench-title">Anthropic Published Siren Results vs. Open Siren Harness Benchmarks</title>
  <desc id="siren-bench-desc">Two-panel monochrome bar chart separating Anthropic's published Siren findings (November 24, 2026) on the left from Open Siren v0.2's local deterministic harness and Stage 1 Auto-Gate verification metrics on the right.</desc>
  <defs>
    <style>
      #siren-bench-root {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .serif {
        font-family: Georgia, 'Times New Roman', serif;
      }
    </style>
  </defs>

  <!-- Paper background -->
  <rect width="960" height="440" rx="10" fill="#f5f5f4" stroke="#d4d4d4" stroke-width="1"/>

  <!-- Header -->
  <text x="40" y="34" fill="#525252" font-size="9.5" class="mono" letter-spacing="1.6">BENCHMARK SNAPSHOT · PUBLISHED BASELINE &amp; LOCAL HARNESS VERIFICATION</text>
  <text x="40" y="60" fill="#141414" font-size="22" class="serif">Why the Mitigations Matter &amp; Verified Harness Numbers</text>

  <!-- LEFT CARD: Anthropic Published Siren Results (Nov 24, 2026) -->
  <rect x="40" y="84" width="428" height="308" rx="8" fill="#ffffff" stroke="#141414" stroke-opacity="0.2" stroke-width="1"/>
  <text x="60" y="110" fill="#141414" font-size="13" font-weight="600">Anthropic Published Siren Findings</text>
  <text x="60" y="126" fill="#737373" font-size="8.5" class="mono">Source: safeguards.anthropic.com/2026/siren (1,700+ scenarios)</text>
  <line x1="60" y1="138" x2="448" y2="138" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Metric bars (max width 220px = 100%) -->
  <!-- Row 1 -->
  <text x="60" y="164" fill="#141414" font-size="10.5" font-weight="600">Claude 5.5 / Mythos 5.2 (reached outside)</text>
  <rect x="60" y="174" width="240" height="14" rx="2" fill="#e5e5e5"/>
  <rect x="60" y="174" width="77" height="14" rx="2" fill="#525252"/>
  <text x="312" y="185" fill="#141414" font-size="9.5" class="mono">21% - 32%</text>

  <!-- Row 2 -->
  <text x="60" y="214" fill="#141414" font-size="10.5" font-weight="600">Earlier Mythos 5 (misaligned use)</text>
  <rect x="60" y="224" width="240" height="14" rx="2" fill="#e5e5e5"/>
  <rect x="60" y="224" width="62" height="14" rx="2" fill="#eb6c36"/>
  <text x="312" y="235" fill="#eb6c36" font-size="9.5" class="mono" font-weight="600">25.8%</text>

  <!-- Row 3 -->
  <text x="60" y="264" fill="#141414" font-size="10.5" font-weight="600">Claude 5.5 / Mythos 5.2 (misaligned use)</text>
  <rect x="60" y="274" width="240" height="14" rx="2" fill="#e5e5e5"/>
  <rect x="60" y="274" width="4" height="14" rx="2" fill="#141414"/>
  <text x="312" y="285" fill="#141414" font-size="9.5" class="mono">0.6% - 1.6%</text>

  <!-- Row 4 -->
  <text x="60" y="314" fill="#141414" font-size="10.5" font-weight="600">6-rule prompt drop (reaching outside)</text>
  <rect x="60" y="324" width="240" height="14" rx="2" fill="#e5e5e5"/>
  <rect x="60" y="324" width="230" height="14" rx="2" fill="#141414"/>
  <text x="312" y="335" fill="#141414" font-size="9.5" class="mono">-68% to -96%</text>

  <text x="60" y="370" fill="#525252" font-size="8.5" class="mono">All mitigations + Auto Mode: 0% misaligned on 5/6 models.</text>

  <!-- RIGHT CARD: Open Siren v0.2 Local Harness Benchmarks -->
  <rect x="492" y="84" width="428" height="308" rx="8" fill="#ffffff" stroke="#141414" stroke-width="1.4"/>
  <text x="512" y="110" fill="#141414" font-size="13" font-weight="600">Open Siren v0.2 Harness Verification</text>
  <text x="512" y="126" fill="#737373" font-size="8.5" class="mono">Measured on Apple M4 · local_jail + scripted escapist (n=72)</text>
  <line x1="512" y1="138" x2="900" y2="138" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="512" y="164" fill="#141414" font-size="10.5" font-weight="600">Scripted escapist baseline (none)</text>
  <rect x="512" y="174" width="240" height="14" rx="2" fill="#e5e5e5"/>
  <rect x="512" y="174" width="240" height="14" rx="2" fill="#eb6c36"/>
  <text x="764" y="185" fill="#eb6c36" font-size="9.5" class="mono" font-weight="600">100.0% (12/12)</text>

  <!-- Row 2 -->
  <text x="512" y="214" fill="#141414" font-size="10.5" font-weight="600">Live auto_gate Stage 1 (escapes remaining)</text>
  <rect x="512" y="224" width="240" height="14" rx="2" fill="#e5e5e5"/>
  <rect x="512" y="224" width="20" height="14" rx="2" fill="#141414"/>
  <text x="764" y="235" fill="#141414" font-size="9.5" class="mono">8.3% (-91.7%)</text>

  <!-- Row 3 -->
  <text x="512" y="264" fill="#141414" font-size="10.5" font-weight="600">Offline replay-gate block rate (n=48)</text>
  <rect x="512" y="274" width="240" height="14" rx="2" fill="#e5e5e5"/>
  <rect x="512" y="274" width="160" height="14" rx="2" fill="#525252"/>
  <text x="764" y="285" fill="#141414" font-size="9.5" class="mono">66.7% (32/48)</text>

  <!-- Row 4 -->
  <text x="512" y="314" fill="#141414" font-size="10.5" font-weight="600">Benign DevOps false-positive rate (n=25+)</text>
  <rect x="512" y="324" width="240" height="14" rx="2" fill="#e5e5e5"/>
  <rect x="512" y="324" width="2" height="14" rx="2" fill="#141414"/>
  <text x="764" y="335" fill="#141414" font-size="9.5" class="mono">0.0% (0 blocked)</text>

  <text x="512" y="370" fill="#525252" font-size="8.5" class="mono">72 real episodes in 3.36s (46.6 ms/ep) · 262/262 CI tests pass.</text>

  <!-- Footer disclaimer -->
  <text x="40" y="418" fill="#737373" font-size="8.5" class="mono">Note: Left = Anthropic published model results; Right = Open Siren deterministic scripted harness check (not comparable).</text>
</svg>
