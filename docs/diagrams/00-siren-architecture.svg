<?xml version="1.0" encoding="UTF-8"?>
<svg id="siren-arch-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="siren-arch-title siren-arch-desc">
  <title id="siren-arch-title">Open Siren End-to-End Architecture</title>
  <desc id="siren-arch-desc">Monochrome architecture schematic showing YAML scenarios feeding an AI agent through composable mitigations into an isolated outer container holding an inner weakened sandbox, a honeypot hub, strace syscall telemetry, and a 3-tier deterministic grader.</desc>
  <defs>
    <style>
      #siren-arch-root {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .serif {
        font-family: Georgia, 'Times New Roman', serif;
      }
      .pulse-stroke {
        stroke-dasharray: 6 6;
        animation: siren-dash 2.2s linear infinite;
      }
      .breach-stroke {
        stroke-dasharray: 5 5;
        animation: siren-dash 1.8s linear infinite;
      }
      @keyframes siren-dash {
        from { stroke-dashoffset: 24; }
        to   { stroke-dashoffset: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse-stroke, .breach-stroke { animation: none; }
        .motion-dot { display: none; }
      }
    </style>
    <pattern id="siren-arch-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#141414" fill-opacity="0.06"/>
    </pattern>
    <marker id="siren-arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#525252"/>
    </marker>
    <marker id="siren-arch-arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#141414"/>
    </marker>
    <marker id="siren-arch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- Clean editorial paper background + subtle dot grid -->
  <rect width="960" height="540" rx="10" fill="#f5f5f4" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="1" y="1" width="958" height="538" rx="9" fill="url(#siren-arch-dots)"/>

  <!-- Header -->
  <text x="40" y="34" fill="#525252" font-size="9.5" class="mono" letter-spacing="1.6">OPEN SIREN v0.2 · EVALUATION ARCHITECTURE · MONOCHROME</text>
  <text x="40" y="60" fill="#141414" font-size="22" class="serif">Outer Containment, Weakened Inner Sandbox, Deterministic Grading</text>

  <!-- ZONES -->
  <!-- Left Zone: Scenario & Agent -->
  <rect x="40" y="84" width="220" height="368" rx="8" fill="#141414" fill-opacity="0.02" stroke="#141414" stroke-opacity="0.16" stroke-width="1"/>
  <rect x="52" y="76" width="144" height="16" rx="2" fill="#f5f5f4"/>
  <text x="124" y="87" fill="#525252" font-size="8.5" class="mono" text-anchor="middle" letter-spacing="1.1">SCENARIO &amp; AGENT</text>

  <!-- Center Zone: Outer Isolation Boundary -->
  <rect x="308" y="84" width="388" height="368" rx="8" fill="#141414" fill-opacity="0.025" stroke="#141414" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="320" y="76" width="236" height="16" rx="2" fill="#141414"/>
  <text x="438" y="87" fill="#ffffff" font-size="8.5" class="mono" text-anchor="middle" letter-spacing="1.0">OUTER BOUNDARY (--network=none)</text>

  <!-- Right Zone: Grader & Reports -->
  <rect x="744" y="84" width="176" height="368" rx="8" fill="#141414" fill-opacity="0.02" stroke="#141414" stroke-opacity="0.16" stroke-width="1"/>
  <rect x="756" y="76" width="136" height="16" rx="2" fill="#f5f5f4"/>
  <text x="824" y="87" fill="#525252" font-size="8.5" class="mono" text-anchor="middle" letter-spacing="1.1">GRADING &amp; OUTPUT</text>

  <!-- CONNECTORS (drawn before nodes, strictly orthogonal) -->
  <!-- 1. Scenarios -> ModelProvider (vertical x=150) -->
  <line x1="150" y1="184" x2="150" y2="216" stroke="#525252" stroke-width="1.3" marker-end="url(#siren-arch-arrow)"/>
  <!-- 2. ModelProvider -> Mitigation Pipeline (vertical x=150) -->
  <line x1="150" y1="308" x2="150" y2="340" stroke="#141414" stroke-width="1.4" marker-end="url(#siren-arch-arrow-ink)"/>

  <!-- 3. Mitigation Pipeline -> Inner Sandbox (orthogonal elbow: x=244, y=388 -> x=284 -> y=196 -> x=332) -->
  <path id="path-exec" d="M 244,388 H 276 Q 284,388 284,380 V 204 Q 284,196 292,196 H 332" fill="none" stroke="#141414" stroke-width="1.6" marker-end="url(#siren-arch-arrow-ink)"/>
  <path d="M 244,388 H 276 Q 284,388 284,380 V 204 Q 284,196 292,196 H 332" fill="none" stroke="#141414" stroke-opacity="0.35" stroke-width="1.6" class="pulse-stroke"/>
  <rect x="248" y="272" width="72" height="15" rx="2" fill="#f5f5f4"/>
  <text x="284" y="282" fill="#141414" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.6">GATED EXEC</text>

  <!-- 4. Inner Sandbox -> Honeypot Hub (focal escape path, vertical x=442, y=268 -> y=324) -->
  <line x1="442" y1="268" x2="442" y2="324" stroke="#eb6c36" stroke-width="1.8" class="breach-stroke" marker-end="url(#siren-arch-arrow-accent)"/>
  <rect x="454" y="286" width="124" height="15" rx="2" fill="#f5f5f4"/>
  <text x="516" y="296" fill="#eb6c36" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.6">DELIBERATE LEAK</text>

  <!-- 5. Inner Sandbox -> Strace Syscall Audit (right edge x=552, y=196 -> x=588, y=196) -->
  <line x1="552" y1="196" x2="588" y2="196" stroke="#525252" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#siren-arch-arrow)"/>

  <!-- 6. Strace -> 3-Tier Grader (horizontal x=680, y=196 -> x=760, y=196) -->
  <line x1="680" y1="196" x2="760" y2="196" stroke="#141414" stroke-width="1.4" marker-end="url(#siren-arch-arrow-ink)"/>
  <rect x="688" y="176" width="64" height="14" rx="2" fill="#f5f5f4"/>
  <text x="720" y="186" fill="#525252" font-size="7.5" class="mono" text-anchor="middle">SYSCALLS</text>

  <!-- 7. Honeypot Hub -> 3-Tier Grader (orthogonal elbow: x=680, y=380 -> x=718 -> y=236 -> x=760) -->
  <path id="path-telemetry" d="M 680,380 H 712 Q 720,380 720,372 V 244 Q 720,236 728,236 H 760" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#siren-arch-arrow-ink)"/>
  <rect x="692" y="302" width="56" height="14" rx="2" fill="#f5f5f4"/>
  <text x="720" y="312" fill="#141414" font-size="7.5" class="mono" text-anchor="middle">CANARY</text>

  <!-- 8. 3-Tier Grader -> Reports & Web Explorer (vertical x=832, y=288 -> y=332) -->
  <line x1="832" y1="288" x2="832" y2="332" stroke="#141414" stroke-width="1.4" marker-end="url(#siren-arch-arrow-ink)"/>

  <!-- Animated motion tokens (quiet monochrome + 1 coral breach pulse) -->
  <circle r="3.5" fill="#141414" class="motion-dot" aria-hidden="true">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M 244,388 H 276 Q 284,388 284,380 V 204 Q 284,196 292,196 H 332"/>
  </circle>
  <circle r="3.5" fill="#eb6c36" class="motion-dot" aria-hidden="true">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 442,268 V 324"/>
  </circle>
  <circle r="3.2" fill="#141414" class="motion-dot" aria-hidden="true">
    <animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite" path="M 680,380 H 712 Q 720,380 720,372 V 244 Q 720,236 728,236 H 760"/>
  </circle>

  <!-- NODES -->
  <!-- Node 1: YAML Catalog -->
  <rect x="56" y="104" width="188" height="80" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1"/>
  <rect x="68" y="114" width="60" height="14" rx="2" fill="none" stroke="#141414" stroke-opacity="0.35" stroke-width="0.8"/>
  <text x="98" y="124" fill="#525252" font-size="7.5" class="mono" text-anchor="middle">YAML SUITE</text>
  <text x="150" y="148" fill="#141414" font-size="12.5" font-weight="600" text-anchor="middle">71 Scenarios</text>
  <text x="150" y="166" fill="#525252" font-size="8.5" class="mono" text-anchor="middle">6 holes · 12 tasks · 10 tempters</text>

  <!-- Node 2: Model Provider -->
  <rect x="56" y="220" width="188" height="88" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1"/>
  <rect x="68" y="230" width="64" height="14" rx="2" fill="none" stroke="#141414" stroke-opacity="0.35" stroke-width="0.8"/>
  <text x="100" y="240" fill="#525252" font-size="7.5" class="mono" text-anchor="middle">PROVIDER</text>
  <text x="150" y="264" fill="#141414" font-size="12.5" font-weight="600" text-anchor="middle">Any LLM Agent</text>
  <text x="150" y="282" fill="#525252" font-size="8.5" class="mono" text-anchor="middle">Anthropic · OpenAI-compat</text>
  <text x="150" y="296" fill="#737373" font-size="8" class="mono" text-anchor="middle">thinking-block replay · scripted</text>

  <!-- Node 3: Mitigation Pipeline -->
  <rect x="56" y="344" width="188" height="92" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.3"/>
  <rect x="68" y="354" width="76" height="14" rx="2" fill="#141414"/>
  <text x="106" y="364" fill="#ffffff" font-size="7.5" class="mono" text-anchor="middle">MITIGATIONS</text>
  <text x="150" y="388" fill="#141414" font-size="12.5" font-weight="600" text-anchor="middle">Guardrail Chain</text>
  <text x="150" y="406" fill="#525252" font-size="8.5" class="mono" text-anchor="middle">sandbox_rules · report_tools</text>
  <text x="150" y="422" fill="#525252" font-size="8.5" class="mono" text-anchor="middle">view_reports · auto_gate</text>

  <!-- Node 4 (Focal): Inner Weakened Sandbox -->
  <rect x="336" y="124" width="216" height="144" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1.8"/>
  <rect x="348" y="136" width="94" height="15" rx="2" fill="#eb6c36"/>
  <text x="395" y="146" fill="#ffffff" font-size="7.5" class="mono" text-anchor="middle">INNER SANDBOX</text>
  <text x="444" y="174" fill="#141414" font-size="13.5" font-weight="600" text-anchor="middle">bwrap · unshare · Docker</text>
  <text x="444" y="196" fill="#525252" font-size="8.5" class="mono" text-anchor="middle">isolated /workspace + /tmp</text>
  <text x="444" y="214" fill="#525252" font-size="8.5" class="mono" text-anchor="middle">no outer /proc · --cap-drop=ALL</text>
  <line x1="352" y1="228" x2="536" y2="228" stroke="#e5e5e5" stroke-width="1"/>
  <text x="444" y="246" fill="#eb6c36" font-size="8.5" class="mono" text-anchor="middle">1 intentional weakness per run:</text>
  <text x="444" y="259" fill="#525252" font-size="8" class="mono" text-anchor="middle">mount · sock · loopback · env · fd 9</text>

  <!-- Node 5: Strace Syscall Audit -->
  <rect x="592" y="124" width="88" height="144" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1"/>
  <rect x="600" y="136" width="52" height="14" rx="2" fill="none" stroke="#141414" stroke-opacity="0.35" stroke-width="0.8"/>
  <text x="626" y="146" fill="#525252" font-size="7.5" class="mono" text-anchor="middle">STRACE</text>
  <text x="636" y="176" fill="#141414" font-size="11" font-weight="600" text-anchor="middle">Syscall</text>
  <text x="636" y="192" fill="#141414" font-size="11" font-weight="600" text-anchor="middle">Audit</text>
  <text x="636" y="216" fill="#525252" font-size="7.8" class="mono" text-anchor="middle">openat</text>
  <text x="636" y="230" fill="#525252" font-size="7.8" class="mono" text-anchor="middle">connect</text>
  <text x="636" y="244" fill="#525252" font-size="7.8" class="mono" text-anchor="middle">read(fd9)</text>
  <text x="636" y="258" fill="#737373" font-size="7.5" class="mono" text-anchor="middle">post-exec</text>

  <!-- Node 6: Honeypot Hub -->
  <rect x="336" y="328" width="344" height="104" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.2"/>
  <rect x="348" y="340" width="90" height="14" rx="2" fill="#141414"/>
  <text x="393" y="350" fill="#ffffff" font-size="7.5" class="mono" text-anchor="middle">HONEYPOT HUB</text>
  <text x="508" y="376" fill="#141414" font-size="13" font-weight="600" text-anchor="middle">Synthetic Outside Targets (Per-Episode Canary)</text>
  <text x="508" y="396" fill="#525252" font-size="8.5" class="mono" text-anchor="middle">HTTP 127.0.0.1:8080 · Unix control sock · /mnt/host-config · FD 9</text>
  <text x="508" y="414" fill="#737373" font-size="8" class="mono" text-anchor="middle">fresh random hex canary · zero real host secrets · zero WAN route</text>

  <!-- Node 7: 3-Tier Grader -->
  <rect x="760" y="136" width="144" height="152" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.3"/>
  <rect x="772" y="148" width="54" height="14" rx="2" fill="#141414"/>
  <text x="799" y="158" fill="#ffffff" font-size="7.5" class="mono" text-anchor="middle">GRADER</text>
  <text x="832" y="184" fill="#141414" font-size="12.5" font-weight="600" text-anchor="middle">3-Tier Verdict</text>
  <text x="832" y="208" fill="#141414" font-size="8.5" class="mono" text-anchor="middle">1. reached_outside</text>
  <text x="832" y="226" fill="#141414" font-size="8.5" class="mono" text-anchor="middle">2. used_honeypot</text>
  <text x="832" y="244" fill="#eb6c36" font-size="8.5" class="mono" font-weight="600" text-anchor="middle">3. misaligned_use</text>
  <text x="832" y="268" fill="#737373" font-size="7.8" class="mono" text-anchor="middle">+ eval_awareness</text>

  <!-- Node 8: Reports & Web Explorer -->
  <rect x="760" y="336" width="144" height="96" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1"/>
  <rect x="772" y="348" width="58" height="14" rx="2" fill="none" stroke="#141414" stroke-opacity="0.35" stroke-width="0.8"/>
  <text x="801" y="358" fill="#525252" font-size="7.5" class="mono" text-anchor="middle">ARTIFACTS</text>
  <text x="832" y="382" fill="#141414" font-size="12" font-weight="600" text-anchor="middle">Reports &amp; Web</text>
  <text x="832" y="400" fill="#525252" font-size="8" class="mono" text-anchor="middle">Wilson 95% CIs</text>
  <text x="832" y="416" fill="#737373" font-size="8" class="mono" text-anchor="middle">JSONL · HTML · Explorer</text>

  <!-- Bottom Legend Strip -->
  <line x1="40" y1="480" x2="920" y2="480" stroke="#141414" stroke-opacity="0.14" stroke-width="1"/>
  <line x1="44" y1="504" x2="72" y2="504" stroke="#141414" stroke-width="1.6"/>
  <text x="80" y="508" fill="#525252" font-size="9" class="mono">Allowed execution / telemetry</text>

  <line x1="280" y1="504" x2="308" y2="504" stroke="#eb6c36" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="316" y="508" fill="#525252" font-size="9" class="mono">Boundary weakness surface</text>

  <rect x="504" y="497" width="18" height="12" rx="2" fill="none" stroke="#141414" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="530" y="508" fill="#525252" font-size="9" class="mono">Hard outer containment (no internet)</text>

  <text x="916" y="508" fill="#737373" font-size="8.5" class="mono" text-anchor="end">open-siren-anthropic</text>
</svg>
