[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "open-siren-anthropic"
version = "0.1.0"
description = "Open-source evaluation harness and mitigation testbed for AI agent sandbox escape propensity, inspired by Anthropic's Siren safeguards research."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = [
    "ai-safety",
    "sandbox-escape",
    "anthropic",
    "siren",
    "agent-evaluation",
    "security",
    "llm-evals",
]
dependencies = [
    "pydantic>=2.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
open-siren = "open_siren.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/open_siren"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "docker: tests requiring a running Docker daemon",
]
