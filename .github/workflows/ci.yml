name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python (ruff & pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dev dependencies
        run: uv sync --dev

      - name: Check formatting (ruff format)
        run: uv run ruff format --check src tests

      - name: Lint (ruff check)
        run: uv run ruff check src tests

      - name: Run test suite (contract, unit, integration)
        run: uv run pytest tests/contract tests/unit tests/integration -q

  web-build:
    name: Web Dashboard (pnpm & vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile || pnpm --dir web install

      - name: Typecheck web app
        run: pnpm --dir web exec tsc --noEmit

      - name: Build web app
        run: pnpm --dir web run build
